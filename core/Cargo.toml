[workspace]
resolver = "2"
members = ["crates/aetherlink-cli", "crates/aetherlink-core", "crates/aetherlink-proto"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"

[workspace.dependencies]
aetherlink-core = { path = "crates/aetherlink-core" }
aetherlink-proto = { path = "crates/aetherlink-proto" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
blake3 = "1.5"
memmap2 = "0.9"
prost = "0.13"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "fs", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
