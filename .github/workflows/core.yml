name: core

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test --all-features

      # Bindings are generated from the built library's own metadata, so this
      # catches an FFI surface that compiles but cannot be expressed in Kotlin
      # or Swift.
      - name: Generate bindings
        run: |
          cargo build --release -p aetherlink-ffi --bin uniffi-bindgen
          for lang in kotlin swift; do
            ./target/release/uniffi-bindgen generate \
              --library target/release/libaetherlink_ffi.so \
              --language "$lang" --out-dir "target/bindings/$lang" --no-format
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bindings
          path: core/target/bindings/
